[amu_tensioner tensioner_gate_0]
extruding_velocity: 40
unextruding_velocity: 30
accel: 1000
stop_type: instant
direction_debounce_delay: 3
tension_pin: mmu:MMU_TENSIONER_GATE_0
fil_sensor_pin: filament_switch_sensor mmu_pre_gate_0
mmu_gear_stepper : stepper_mmu_gear
step_pin: mmu:MMU_GEAR_STEP_1
dir_pin: !mmu:MMU_GEAR_DIR_1
enable_pin: !mmu:MMU_GEAR_ENABLE_1
microsteps: 16
rotation_distance:20
disable_delay: 0.4
disable_steppers: False

[tmc2209 amu_tensioner tensioner_gate_0]
uart_pin: mmu:MMU_GEAR_UART_1
run_current: 0.9
interpolate: false


