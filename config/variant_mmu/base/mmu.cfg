# PIN ALIASES FOR MMU MCU BOARD ----------------------------------------------------------------------------------------
# ██████╗ ██╗███╗   ██╗     █████╗ ██╗     ██╗ █████╗ ███████╗
# ██╔══██╗██║████╗  ██║    ██╔══██╗██║     ██║██╔══██╗██╔════╝
# ██████╔╝██║██╔██╗ ██║    ███████║██║     ██║███████║███████╗
# ██╔═══╝ ██║██║╚██╗██║    ██╔══██║██║     ██║██╔══██║╚════██║
# ██║     ██║██║ ╚████║    ██║  ██║███████╗██║██║  ██║███████║
# ╚═╝     ╚═╝╚═╝  ╚═══╝    ╚═╝  ╚═╝╚══════╝╚═╝╚═╝  ╚═╝╚══════╝
# Section to create alias for pins used by MMU for easier integration into Klippain and RatOS. The names match those
# referenced in the mmu_hardware.cfg file. If you get into difficulty you can also comment out this aliases definition
# completely and configure the pin names directly into mmu_hardware.cfg. However, use of aliases is encouraged.

# Note: that aliases are not created for TOOLHEAD_SENSOR, EXTRUDER_SENSOR or SYNC_FEEDBACK_SENSORS because those are
# most likely on the printer's main mcu. These should be set directly in mmu_hardware.cfg
#
[board_pins mmu]
mcu: mmu # Assumes using an external / extra mcu dedicated to MMU
aliases:
    MMU_GEAR_UART=PC4,
    MMU_GEAR_STEP=PF13,
    MMU_GEAR_DIR=PF12,
    MMU_GEAR_ENABLE=PF14,

    MMU_GEAR_UART_1=PD11,
    MMU_GEAR_STEP_1=PG0,
    MMU_GEAR_DIR_1=PG1,
    MMU_GEAR_ENABLE_1=PF15,

    MMU_GEAR_UART_2=PC6,
    MMU_GEAR_STEP_2=PF11,
    MMU_GEAR_DIR_2=PG3,
    MMU_GEAR_ENABLE_2=PG5,

    MMU_GEAR_UART_3=PC7,
    MMU_GEAR_STEP_3=PG4,
    MMU_GEAR_DIR_3=PC1,
    MMU_GEAR_ENABLE_3=PA2,

    MMU_GEAR_UART_4=PF2,
    MMU_GEAR_STEP_4=PF9,
    MMU_GEAR_DIR_4=PF10,
    MMU_GEAR_ENABLE_4=PG2,

    MMU_GEAR_UART_5=PE4,
    MMU_GEAR_STEP_5=PC13,
    MMU_GEAR_DIR_5=PF0,
    MMU_GEAR_ENABLE_5=PF1,

    MMU_GEAR_UART_6=PE1,
    MMU_GEAR_STEP_6=PE2,
    MMU_GEAR_DIR_6=PE3,
    MMU_GEAR_ENABLE_6=PD4,

    MMU_GEAR_UART_7=PD3,
    MMU_GEAR_STEP_7=PE6,
    MMU_GEAR_DIR_7=PA14,
    MMU_GEAR_ENABLE_7=PE0,

    MMU_GATE_SENSOR=PC0,
    MMU_NEOPIXEL=PB0,
    
    MMU_PRE_GATE_0=PG11,
    MMU_TENSIONER_GATE_0 = PG15,

    MMU_PRE_GATE_1=PG10,
    MMU_TENSIONER_GATE_1=PG14,

    MMU_PRE_GATE_2=PG9,
    MMU_TENSIONER_GATE_2=PG13,

    MMU_PRE_GATE_3=PG6,
    MMU_TENSIONER_GATE_3=PG12,
