# ============================================================================
# TABELA DE POSIÇÕES DO PRINT CORE  (edita só aqui)
# Coordenadas da MÁQUINA em mm (as de printer.toolhead.position, não as do
# G-code: não levam offsets). Para achar a posição certa: põe a cabeça onde
# queres trocar o print core e corre PRINT_CORE_SWAP_POS_FROM_HERE, que
# escreve as linhas já no formato desta tabela.
# Valores de arranque = os do PRINT_CORE_CHANGE antigo (X a meio, Y250, Z50).
# ============================================================================
[gcode_macro PRINT_CORE_POSITIONS]
description: Mostra a tabela de posições do print core
variable_swap_x: 251     # antigo: axis_maximum.x / 2
variable_swap_y: 250
variable_swap_z: 50
variable_speed_xy: 150   # mm/s
variable_speed_z: 10     # mm/s (o Klipper limita ao max_z_velocity)
gcode:
    RESPOND MSG="Posição de troca: X{swap_x} Y{swap_y} Z{swap_z} (XY {speed_xy} mm/s, Z {speed_z} mm/s)"

[gcode_macro PRINT_CORE_SWAP_POS_FROM_HERE]
description: Mostra a posição atual da cabeça no formato da tabela
gcode:
    {% set p = printer.toolhead.position %}
    RESPOND MSG="Copia para PRINT_CORE_POSITIONS em config/print_core_change.cfg:"
    RESPOND MSG="variable_swap_x: {"%.1f"|format(p.x)}"
    RESPOND MSG="variable_swap_y: {"%.1f"|format(p.y)}"
    RESPOND MSG="variable_swap_z: {"%.1f"|format(p.z)}"

[gcode_macro PRINT_CORE_GOTO_POSITION]
description: Vai à posição da tabela, sem modo de troca (para testar valores)
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    {% if 'bed_custom_bound' in printer %}
        RESTORE_DEFAULT_BOUNDARY
    {% endif %}
    PRINTCORE_GOTO_SWAP X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    {% if 'bed_custom_bound' in printer %}
        SET_CUSTOM_BOUNDARY MOVE_TO_PARK=False
    {% endif %}

# ============================================================================
# FLUXO DA TROCA DO PRINT CORE
#
#   PRINT_CORE_CHANGE            pede a troca
#     |- filamento descarregado  -> segue
#     |- filamento carregado     -> PÁRA e pergunta (phase = await_unload):
#     |      PRINT_CORE_CHANGE UNLOAD=1   descarrega (MMU_UNLOAD) e segue
#     |      PRINT_CORE_CHANGE_CANCEL     desiste
#     |      (expira sozinho ao fim de ask_timeout s)
#   -> prepara (home, limpa o nozzle, vai à posição, arrefece)
#   -> confirma outra vez "sem filamento" -> PRINTCORE_SWAP_START (modo de troca)
#   PRINT_CORE_CHANGE_DONE       termina a troca (macro em printcore.cfg)
#
# O Klipper só avalia o texto de uma macro de uma vez, ANTES de executar as
# suas linhas. Por isso cada etapa é uma macro própria: assim o estado do
# filamento é lido de novo depois de o MMU_UNLOAD e do arrefecimento.
#
# "Filamento carregado" = sensor do toolhead ativo OU printer.mmu.filament
# diferente de "Unloaded" (desconhecido conta como carregado). Sem Happy Hare
# ativo usa a variável antiga filament_loaded (em falta = carregado).
# A definição está num único sítio: _PRINT_CORE_GATE.
#
# Estados para o ecrã (variável phase de PRINT_CORE_CHANGE):
#   idle | await_unload | unloading | preparing
# Quando o modo de troca arranca a fase volta a idle e o ecrã deve ler
# printcore.swap_active. Se uma etapa falhar a meio a fase pode ficar em
# unloading/preparing: PRINT_CORE_CHANGE_CANCEL ou um novo pedido repõem idle.
# ============================================================================
[gcode_macro PRINT_CORE_CHANGE]
description: Troca do print core. Com filamento carregado pergunta antes de descarregar (UNLOAD=1 confirma)
variable_phase: 'idle'        # idle | await_unload | unloading | preparing
variable_ask_timeout: 120     # s que o pedido de descarregamento fica à espera
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error("Há uma impressão em curso (%s): cancela-a antes de trocar o print core" % printer.print_stats.state)}
    {% endif %}
    {% if printer.printcore.swap_active %}
        {action_raise_error("Já há uma troca em curso: termina-a com PRINT_CORE_CHANGE_DONE")}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=PRINT_CORE_CHANGE_EXPIRE DURATION=0
    {% if params.UNLOAD|default(0)|int == 1 %}
        _PRINT_CORE_GATE THEN="_PRINT_CORE_CHANGE_PREPARE UNLOADED_NOW=0" LOADED="_PRINT_CORE_UNLOAD"
    {% else %}
        _PRINT_CORE_GATE THEN="_PRINT_CORE_CHANGE_PREPARE UNLOADED_NOW=0" LOADED="_PRINT_CORE_ASK"
    {% endif %}

[gcode_macro PRINT_CORE_CHANGE_CANCEL]
description: Desiste de um pedido de troca (só antes do modo de troca)
gcode:
    {% if printer.printcore.swap_active %}
        {action_raise_error("Troca em curso: termina-a com PRINT_CORE_CHANGE_DONE")}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=PRINT_CORE_CHANGE_EXPIRE DURATION=0
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    RESPOND MSG="Pedido de troca do print core cancelado."

[delayed_gcode PRINT_CORE_CHANGE_EXPIRE]
gcode:
    {% if printer["gcode_macro PRINT_CORE_CHANGE"].phase == 'await_unload' %}
        SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
        RESPOND MSG="O pedido de troca do print core expirou (o filamento continua carregado)."
    {% endif %}

# --- Etapas internas ---------------------------------------------------------

# Corre THEN se não houver filamento carregado; senão corre LOADED (se dado)
# ou aborta a troca. É o único sítio que decide se há filamento carregado.
[gcode_macro _PRINT_CORE_GATE]
description: Interna: porta de verificação do filamento
gcode:
    {% set loaded = false %}
    {% if 'mmu' in printer and printer.mmu.enabled|default(true) %}
        {% set sensors = printer.mmu.sensors|default({}) %}
        {% if sensors.toolhead|default(false) or printer.mmu.filament|default('Unknown') != 'Unloaded' %}
            {% set loaded = true %}
        {% endif %}
    {% elif printer.save_variables.variables.filament_loaded|default(true) %}
        {% set loaded = true %}
    {% endif %}
    {% if loaded %}
        {% if params.LOADED is defined %}
            {params.LOADED}
        {% else %}
            SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
            RESPOND TYPE=error MSG="FILAMENTO AINDA CARREGADO: troca abortada, não entrou em modo de troca."
        {% endif %}
    {% else %}
        {params.THEN}
    {% endif %}

[gcode_macro _PRINT_CORE_ASK]
description: Interna: pede ao utilizador para descarregar o filamento
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_CHANGE"] %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'await_unload'"
    UPDATE_DELAYED_GCODE ID=PRINT_CORE_CHANGE_EXPIRE DURATION={t.ask_timeout}
    RESPOND TYPE=error MSG="FILAMENTO CARREGADO: a troca do print core NÃO começou."
    RESPOND MSG="Descarregar e continuar: PRINT_CORE_CHANGE UNLOAD=1"
    RESPOND MSG="Ou descarrega à mão (MMU_UNLOAD) e volta a correr PRINT_CORE_CHANGE."
    RESPOND MSG="Desistir: PRINT_CORE_CHANGE_CANCEL (o pedido expira em {t.ask_timeout} s)."

[gcode_macro _PRINT_CORE_UNLOAD]
description: Interna: descarrega o filamento e continua se ficou descarregado
gcode:
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'unloading'"
    RESPOND MSG="A descarregar o filamento (MMU_UNLOAD)..."
    MMU_UNLOAD RESTORE=0
    _PRINT_CORE_GATE THEN="_PRINT_CORE_CHANGE_PREPARE UNLOADED_NOW=1"

[gcode_macro _PRINT_CORE_CHANGE_PREPARE]
description: Interna: home, limpeza, posição de troca e arrefecimento
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    {% set unloaded_now = params.UNLOADED_NOW|default(0)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'preparing'"
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    M400
    G90
    # Como antes: só limpa o nozzle se o filamento já estava descarregado
    # (depois de um descarregamento a limpeza era saltada).
    {% if not unloaded_now %}
        CLEAN_NOZZLE
    {% endif %}
    M400
    {% if 'bed_custom_bound' in printer %}
        RESTORE_DEFAULT_BOUNDARY
    {% endif %}
    PRINTCORE_GOTO_SWAP X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    {% if 'bed_custom_bound' in printer %}
        SET_CUSTOM_BOUNDARY MOVE_TO_PARK=False
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    RESPOND MSG="A arrefecer o hotend para a troca do print core..."
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=45
    _PRINT_CORE_GATE THEN="_PRINT_CORE_CHANGE_LOCK"

[gcode_macro _PRINT_CORE_CHANGE_LOCK]
description: Interna: entra em modo de troca (aquecimento e movimento bloqueados)
gcode:
    {% set t = printer["gcode_macro PRINT_CORE_POSITIONS"] %}
    SET_GCODE_VARIABLE MACRO=PRINT_CORE_CHANGE VARIABLE=phase VALUE="'idle'"
    PRINTCORE_SWAP_START X={t.swap_x} Y={t.swap_y} Z={t.swap_z} SPEED={t.speed_xy} Z_SPEED={t.speed_z}
    RESPOND MSG="Troca o print core e corre PRINT_CORE_CHANGE_DONE"
