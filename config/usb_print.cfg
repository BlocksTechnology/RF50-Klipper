# USB prints started from Mainsail go through BlocksScreen, which copies the
# file to local storage and prints the copy (a pulled stick cannot kill the job).
# BlocksScreen matches the "// action:blocks_usb_print <file>" line; keep both in sync.
# BlocksScreen sets blocksscreen_usb on every Klipper ready. Until then (old or stopped
# BlocksScreen) USB files print directly, as before this macro existed.
# BlocksScreen acks a hand-off by clearing usb_pending; if it is dead the fallback
# below prints from USB and clears the flag until BlocksScreen sets it again.
# usb_pending is set with tojson, which escapes the quote character, so the
# single-quoted VALUE survives Klipper's shlex parsing for any filename.

[gcode_macro SDCARD_PRINT_FILE]
description: Print a file, USB files via a local copy made by BlocksScreen
rename_existing: BASE_SDCARD_PRINT_FILE
variable_blocksscreen_usb: False
variable_usb_pending: ''
gcode:
  {% set fn = params.FILENAME|default('')|string %}
  {% set path = fn.lstrip('/') %}
  {% set top = path.split('/')[0] %}
  {% if blocksscreen_usb and '/' in path and top.startswith(('USB-', 'USB DRIVE')) %}
    {action_respond_info("Copying USB file to local storage before printing")}
    {action_respond_info("action:blocks_usb_print " ~ path)}
    SET_GCODE_VARIABLE MACRO=SDCARD_PRINT_FILE VARIABLE=usb_pending VALUE='{path|tojson}'
    UPDATE_DELAYED_GCODE ID=BLOCKS_USB_FALLBACK DURATION=10
  {% else %}
    BASE_SDCARD_PRINT_FILE {rawparams}
  {% endif %}

[delayed_gcode BLOCKS_USB_FALLBACK]
gcode:
  {% set file = printer["gcode_macro SDCARD_PRINT_FILE"].usb_pending %}
  {% if file %}
    {action_respond_info("BlocksScreen did not answer, printing directly from USB")}
    SET_GCODE_VARIABLE MACRO=SDCARD_PRINT_FILE VARIABLE=usb_pending VALUE='""'
    SET_GCODE_VARIABLE MACRO=SDCARD_PRINT_FILE VARIABLE=blocksscreen_usb VALUE=False
    BASE_SDCARD_PRINT_FILE FILENAME="{file|replace('"', '\\"')}"
  {% endif %}
