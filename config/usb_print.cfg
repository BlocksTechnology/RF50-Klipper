# USB prints started from Mainsail go through BlocksScreen, which copies the
# file to local storage and prints the copy (a pulled stick cannot kill the job).
# BlocksScreen matches the "// action:blocks_usb_print <file>" line; keep both in sync.
# BlocksScreen sets blocksscreen_usb on every Klipper ready. Until then (old or stopped
# BlocksScreen) USB files print directly, as before this macro existed.

[gcode_macro SDCARD_PRINT_FILE]
description: Print a file, USB files via a local copy made by BlocksScreen
rename_existing: BASE_SDCARD_PRINT_FILE
variable_blocksscreen_usb: False
gcode:
  {% set fn = params.FILENAME|default('')|string %}
  {% set path = fn.lstrip('/') %}
  {% set top = path.split('/')[0] %}
  {% if blocksscreen_usb and '/' in path and top.startswith(('USB-', 'USB DRIVE')) %}
    {action_respond_info("Copying USB file to local storage before printing")}
    {action_respond_info("action:blocks_usb_print " ~ path)}
  {% else %}
    BASE_SDCARD_PRINT_FILE {rawparams}
  {% endif %}
