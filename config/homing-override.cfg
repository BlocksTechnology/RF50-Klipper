# RF50 homing: X/Y endstops at the back left, Z probed by Beacon at the bed centre
# No M84: it disables every motor (resets z_tilt); SET_KINEMATIC_POSITION is used instead
[homing_override]
gcode:

  {% if 'bed_custom_bound' in printer %}
     RESTORE_DEFAULT_BOUNDARY
  {% endif %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set z_homed = 'z' in homed %}
  {% set any_axis = 'X' in params or 'Y' in params or 'Z' in params %}
  {% set home_z = 'Z' in params or not any_axis %}
  # Beacon requires X/Y homed, so G28 Z homes them when unknown
  {% set home_xy = 'X' in params or 'Y' in params or not any_axis
                   or 'x' not in homed or 'y' not in homed %}
  {% set lift = [10, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min
                if z_homed else 10 %}

  SAVE_GCODE_STATE NAME=homing_override
  G91
  # Mark Z homed at 0 to lift; held through XY moves since a bed mesh adds Z motion
  {% if not z_homed %}
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
  {% endif %}
  {% if lift > 0 %}
    G0 Z{lift} F{8 * 60}
  {% endif %}

  # Short X move at reduced current before homing
  {% if home_xy %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.65
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.65
    SET_KINEMATIC_POSITION X=0 SET_HOMED=X
    G0 X20 F{100 * 60}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=X
    # Restore stepper current
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.5
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.5
  {% endif %}
  # A Z home keeps the lifted Z for the probe travel; Beacon then sets the true Z
  {% if not z_homed and not home_z %}
    SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
  {% endif %}

  {% if home_xy %}
    G28 Y
    G28 X
  {% endif %}

  {% if home_z %}
    G90
    G1 X250 Y250 F10000
    BEACON_AUTO_CALIBRATE METHOD=proximity SAMPLES_TOLERANCE=0.025
    G1 Z5 F600
  {% endif %}

  # Restored last so a caller in G91 cannot turn the probe travel into a relative move
  RESTORE_GCODE_STATE NAME=homing_override

  {% if 'bed_custom_bound' in printer %}
     SET_CUSTOM_BOUNDARY MOVE_TO_PARK=False
  {% endif %}
axes: xyz
